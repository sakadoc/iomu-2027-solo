<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>IOMU 2027 — The 19th Indonesian Occupational Medicine Updates | Surakarta, Solo</title>
    <meta
      name="description"
      content="Journey through Surakarta (Solo) in an interactive 3D experience for IOMU 2027 — The 19th Indonesian Occupational Medicine Updates, May 7–9, 2027."
    />
    <meta name="theme-color" content="#14302B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              keraton: '#14302B',
              emerald: '#1F4A42',
              'kawung-gold': '#C69C54',
              'light-gold': '#DDBE82',
              'dark-gold': '#8A662C',
              ivory: '#F4E9D7',
            },
            fontFamily: {
              display: ['Montserrat', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
              script: ['"Great Vibes"', 'cursive'],
            },
            boxShadow: {
              gold: '0 8px 32px -8px rgba(198, 156, 84, 0.35)',
              keraton: '0 20px 50px -12px rgba(20, 48, 43, 0.65)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --color-keraton: #14302b;
        --color-emerald: #1f4a42;
        --color-kawung-gold: #c69c54;
        --color-light-gold: #ddbe82;
        --color-dark-gold: #8a662c;
        --color-ivory: #f4e9d7;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #14302b;
        color: #f4e9d7;
        overflow-x: hidden;
      }
      .iomu-diagonal-band {
        transform: skewY(-4deg);
        border-top: 3px solid #c69c54;
        border-bottom: 3px solid #c69c54;
      }
      .iomu-diagonal-band-inner {
        transform: skewY(4deg);
      }
      @media (max-width: 639px) {
        .iomu-diagonal-band {
          transform: skewY(-1.8deg);
        }
        .iomu-diagonal-band-inner {
          transform: skewY(1.8deg);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .iomu-arch-frame {
        border-top-left-radius: 9999px;
        border-top-right-radius: 9999px;
        border-bottom-left-radius: 0.75rem;
        border-bottom-right-radius: 0.75rem;
        border: 2px solid #c69c54;
      }
      .iomu-photo-overlay {
        background: linear-gradient(
          180deg,
          rgba(20, 48, 43, 0.18) 0%,
          rgba(20, 48, 43, 0.55) 55%,
          rgba(20, 48, 43, 0.94) 100%
        );
      }
      .bg-kawung-gold-subtle {
        background-image: url('./public/assets/brand/pola-kawung-emas.png');
        background-size: 360px auto;
        background-repeat: repeat;
      }

      /* Geometric Side-Wipe, Random Bars, Checkerboard, Split Curtain & Venetian Blinds Transitions */
      .iomu-fx-box {
        --iomu-base-skew: 0deg;
        position: relative;
        overflow: hidden;
      }
      .iomu-diagonal-band.iomu-fx-box {
        --iomu-base-skew: -4deg;
      }
      @media (max-width: 639px) {
        .iomu-diagonal-band.iomu-fx-box {
          --iomu-base-skew: -1.8deg;
        }
      }
      .iomu-fx-box.iomu-fx-resetting,
      .iomu-fx-box.iomu-fx-resetting * {
        transition: none !important;
      }
      .iomu-fx-box.iomu-fx-ready:not(.is-fx-revealed)[data-fx-dir="left"] {
        opacity: 0.01;
        transform: translate3d(-68px, 0, 0) skewY(var(--iomu-base-skew));
        clip-path: inset(0 100% 0 0 round 1.5rem);
      }
      .iomu-fx-box.iomu-fx-ready:not(.is-fx-revealed)[data-fx-dir="right"] {
        opacity: 0.01;
        transform: translate3d(68px, 0, 0) skewY(var(--iomu-base-skew));
        clip-path: inset(0 0 0 100% round 1.5rem);
      }
      .iomu-fx-box.iomu-fx-ready.is-fx-revealed {
        opacity: 1;
        transform: translate3d(0, 0, 0) skewY(var(--iomu-base-skew));
        clip-path: inset(0 0% 0 0% round 1.5rem);
        transition:
          transform 0.88s cubic-bezier(0.22, 1, 0.36, 1),
          clip-path 0.82s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.32s ease-out;
      }

      .iomu-fx-shroud {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 35;
        overflow: hidden;
        border-radius: inherit;
      }
      .iomu-fx-curtain-left,
      .iomu-fx-curtain-right,
      .iomu-fx-door-left,
      .iomu-fx-door-right {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(135deg, #14302b 0%, #1f4a42 58%, #0e231f 100%);
        transition: transform 0.88s cubic-bezier(0.22, 1, 0.36, 1) 0.14s, opacity 0.35s ease 0.72s;
      }
      .iomu-fx-curtain-left,
      .iomu-fx-curtain-right {
        inset: 0;
      }
      .iomu-fx-curtain-left::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 5px;
        background: linear-gradient(180deg, #ddbe82, #c69c54, #f4e9d7);
        box-shadow: 0 0 18px rgba(198, 156, 84, 0.85);
      }
      .iomu-fx-curtain-right::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 5px;
        background: linear-gradient(180deg, #ddbe82, #c69c54, #f4e9d7);
        box-shadow: 0 0 18px rgba(198, 156, 84, 0.85);
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud > .iomu-fx-curtain-left {
        transform: translateX(104%);
        opacity: 0;
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud > .iomu-fx-curtain-right {
        transform: translateX(-104%);
        opacity: 0;
      }

      .iomu-fx-door-left {
        left: 0;
        width: 50%;
        border-right: 2px solid #c69c54;
      }
      .iomu-fx-door-right {
        right: 0;
        width: 50%;
        border-left: 2px solid #c69c54;
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud > .iomu-fx-door-left {
        transform: translateX(-104%);
        opacity: 0;
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud > .iomu-fx-door-right {
        transform: translateX(104%);
        opacity: 0;
      }

      .iomu-fx-bars-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
      }
      .iomu-fx-bar {
        background: linear-gradient(180deg, #14302b 0%, #1f4a42 52%, #14302b 100%);
        border-right: 1px solid rgba(198, 156, 84, 0.38);
        transform: scaleY(1) scaleX(1.03);
        transition:
          transform 0.62s cubic-bezier(0.22, 1, 0.36, 1) var(--fx-delay, 0ms),
          opacity 0.4s ease calc(var(--fx-delay, 0ms) + 180ms);
      }
      .iomu-fx-bar:nth-child(even) {
        transform-origin: top center;
      }
      .iomu-fx-bar:nth-child(odd) {
        transform-origin: bottom center;
      }
      .iomu-fx-bar:nth-child(4n) {
        background: linear-gradient(180deg, #1f4a42 0%, #8a662c 18%, #14302b 100%);
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud .iomu-fx-bar {
        transform: scaleY(0) scaleX(0.15);
        opacity: 0;
      }

      .iomu-fx-checker-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }
      .iomu-fx-tile {
        border: 1px solid rgba(198, 156, 84, 0.25);
        transform: perspective(520px) rotateY(0deg) scale(1.02);
        transition:
          transform 0.56s cubic-bezier(0.22, 1, 0.36, 1) var(--fx-delay, 0ms),
          opacity 0.38s ease calc(var(--fx-delay, 0ms) + 140ms);
      }
      .iomu-fx-tile.is-even {
        background: #14302b;
      }
      .iomu-fx-tile.is-odd {
        background: #1f4a42;
        box-shadow: inset 0 0 0 1px rgba(221, 190, 130, 0.22);
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud .iomu-fx-tile {
        transform: perspective(520px) rotateY(88deg) scale(0.1);
        opacity: 0;
      }

      .iomu-fx-blinds-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: repeat(10, minmax(0, 1fr));
      }
      .iomu-fx-blind {
        background: linear-gradient(90deg, #14302b 0%, #1f4a42 50%, #14302b 100%);
        border-bottom: 1px solid rgba(198, 156, 84, 0.42);
        transform-origin: top center;
        transform: scaleY(1.04);
        transition:
          transform 0.56s cubic-bezier(0.22, 1, 0.36, 1) var(--fx-delay, 0ms),
          opacity 0.36s ease calc(var(--fx-delay, 0ms) + 150ms);
      }
      .iomu-fx-box.is-fx-revealed > .iomu-fx-shroud .iomu-fx-blind {
        transform: scaleY(0);
        opacity: 0;
      }

      @keyframes iomuDrawerWipeIn {
        0% {
          opacity: 0.2;
          transform: translate3d(44px, 0, 0);
          clip-path: inset(0 0 0 100% round 1.5rem);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
          clip-path: inset(0 0 0 0 round 1.5rem);
        }
      }
      .iomu-fx-drawer-enter {
        animation: iomuDrawerWipeIn 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .iomu-fx-box,
        .iomu-fx-shroud,
        .iomu-fx-drawer-enter {
          animation: none !important;
          transition: none !important;
          clip-path: none !important;
          opacity: 1 !important;
        }
        .iomu-fx-shroud {
          display: none !important;
        }
      }
    </style>
    <!-- Official Design Master Base64 Asset Bundle (CORS-free for file:// and HTTP) -->
    <script src="./public/assets/brand/brand-assets.js"></script>
    <!-- Three.js & GSAP ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script defer src="./public/app-3d-bundle.js"></script>
  </head>
  <body class="bg-keraton text-ivory antialiased selection:bg-kawung-gold selection:text-keraton">
    <div id="root">
      <div class="flex min-h-screen items-center justify-center bg-[#14302B] text-[#F4E9D7]">
        <p class="font-semibold tracking-wider">Loading IOMU 2027 Surakarta 3D Experience...</p>
      </div>
    </div>
  </body>
</html>
