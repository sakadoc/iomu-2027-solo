<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>IOMU 2027 — The 19th Indonesian Occupational Medicine Updates | Surakarta, Solo</title>
    <meta
      name="description"
      content="Journey through Surakarta (Solo) in an interactive 3D experience for IOMU 2027 — The 19th Indonesian Occupational Medicine Updates, May 7–9, 2027."
    />
    <meta name="theme-color" content="#14302B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-compiled Static Stylesheet (Zero CDN dependency for Edge & Chrome) -->
    <link rel="stylesheet" href="./tailwind-standalone.css?v=2027.5" />
    <style>
      :root {
        --color-keraton: #14302b;
        --color-emerald: #1f4a42;
        --color-kawung-gold: #c69c54;
        --color-light-gold: #ddbe82;
        --color-dark-gold: #8a662c;
        --color-ivory: #f4e9d7;
        --iomu-kawung-accent-url: url('./assets/brand/pola-kawung-accent.png');
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #14302b;
        color: #f4e9d7;
        overflow-x: hidden;
      }
      .iomu-diagonal-band {
        transform: skewY(-4deg);
        border-top: 3px solid #c69c54;
        border-bottom: 3px solid #c69c54;
      }
      .iomu-diagonal-band-inner {
        transform: skewY(4deg);
      }
      @media (max-width: 639px) {
        .iomu-diagonal-band {
          transform: skewY(-1.8deg);
        }
        .iomu-diagonal-band-inner {
          transform: skewY(1.8deg);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .iomu-arch-frame {
        border-top-left-radius: 9999px;
        border-top-right-radius: 9999px;
        border-bottom-left-radius: 0.75rem;
        border-bottom-right-radius: 0.75rem;
        border: 2px solid #c69c54;
      }
      .iomu-photo-overlay {
        background: linear-gradient(
          180deg,
          rgba(20, 48, 43, 0.18) 0%,
          rgba(20, 48, 43, 0.55) 55%,
          rgba(20, 48, 43, 0.94) 100%
        );
      }
      .bg-kawung-gold-subtle {
        background-image: url('./assets/brand/pola-kawung-emas.png');
        background-size: 360px auto;
        background-repeat: repeat;
      }
      .iomu-kawung-accent:not(.fixed):not(.absolute) {
        position: relative;
      }
      .iomu-kawung-accent::before {
        content: "";
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: inherit;
        background-image: var(--iomu-kawung-accent-url);
        background-size: 300px auto;
        background-repeat: repeat;
        background-position: center;
        opacity: 0.16;
      }
      .iomu-kawung-accent > *:not(.fixed):not(.absolute) {
        position: relative;
        z-index: 1;
      }
      /* Swipe In / Swipe Out Footer Delegates Banner */
      .iomu-swipe-banner {
        transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), clip-path 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        will-change: transform, clip-path, opacity;
      }
      .iomu-swipe-banner.is-out {
        transform: translateX(-70px);
        opacity: 0;
        clip-path: inset(0 100% 0 0 round 1.5rem);
        pointer-events: none;
      }
      .iomu-swipe-banner.is-in {
        transform: translateX(0);
        opacity: 1;
        clip-path: inset(0 0% 0 0 round 1.5rem);
        pointer-events: auto;
      }
      .iomu-swipe-banner .iomu-banner-logo {
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.12s, opacity 0.6s ease 0.12s;
        will-change: transform, opacity;
      }
      .iomu-swipe-banner.is-out .iomu-banner-logo {
        transform: scale(0.9) translateX(-30px);
        opacity: 0;
      }
      .iomu-swipe-banner.is-in .iomu-banner-logo {
        transform: scale(1) translateX(0);
        opacity: 1;
      }
    </style>
    <!-- Official Design Master Base64 Asset Bundle (CORS-free for file:// and HTTP) -->
    <script src="./assets/brand/brand-assets.js?v=2027.5"></script>
    <!-- Three.js & GSAP ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script defer src="./app-3d-bundle.js?v=2027.5"></script>
  </head>
  <body class="bg-keraton text-ivory antialiased selection:bg-kawung-gold selection:text-keraton">
    <div id="root">
      <div class="flex min-h-screen items-center justify-center bg-[#14302B] text-[#F4E9D7]">
        <p class="font-semibold tracking-wider">Loading IOMU 2027 Surakarta 3D Experience...</p>
      </div>
    </div>
  </body>
</html>
